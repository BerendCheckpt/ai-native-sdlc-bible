name: Wiki sync

# Publishes content/ to the GitHub wiki after a human-approved merge to main.
# content/ is the single source of truth; the wiki is a generated mirror.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/build-wiki.js'
      - 'src/content.js'
      # Changing the publisher itself must also publish, or a fix to this
      # workflow never reaches the wiki until content/ happens to change.
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build wiki pages from content/
        run: node scripts/build-wiki.js build/wiki
      - name: Push to the wiki repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Wiki tab's pages are stored in <repo>.wiki.git. GitHub only
          # creates it after the first page is saved by hand, and there is no
          # API for that, so stop with an explanation instead of a clone error.
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote "$WIKI_URL" > /dev/null 2>&1; then
            echo "::error title=GitHub Wiki not initialized::The Wiki tab of ${GITHUB_REPOSITORY} has no pages yet, so GitHub has not created its storage. A repository admin must open https://github.com/${GITHUB_REPOSITORY}/wiki, click 'Create the first page' and save it (any content; this workflow overwrites it). Then re-run this workflow. See docs/setup.md, step 3."
            exit 1
          fi
          git clone "$WIKI_URL" wiki
          find wiki -maxdepth 1 -name '*.md' -delete
          cp build/wiki/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "Sync wiki from content/ at ${GITHUB_SHA::7}"
            git push
          fi
