name: Wiki sync

# Publishes content/ to the GitHub wiki after a human-approved merge to main.
# content/ is the single source of truth; the wiki is a generated mirror.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/build-wiki.js'
      - 'src/content.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build wiki pages from content/
        run: node scripts/build-wiki.js build/wiki
      - name: Push to the wiki repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          find wiki -maxdepth 1 -name '*.md' -delete
          cp build/wiki/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "Sync wiki from content/ at ${GITHUB_SHA::7}"
            git push
          fi
